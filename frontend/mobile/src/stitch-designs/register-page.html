<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>注册 - 即时通讯应用</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary": "#32ABFD",
                      "on-primary": "#ffffff",
                      "surface": "#ffffff",
                      "on-surface": "#1e1b13",
                      "on-surface-variant": "#6f7882",
                      "outline-variant": "#e5e7eb",
                      "surface-container-high": "#f9fafb",
                      "surface-container-highest": "#f3f4f6"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "1rem",
                      "2xl": "1.5rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Manrope", "PingFang SC", "Microsoft YaHei", "sans-serif"],
                      "body": ["Plus Jakarta Sans", "PingFang SC", "Microsoft YaHei", "sans-serif"]
              }
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            font-family: 'Plus Jakarta Sans', 'PingFang SC', sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
        }
        h1, h2, h3 {
            font-family: 'Manrope', 'PingFang SC', sans-serif;
        }
        /* Ensure touch targets are at least 44px */
        button, input, a {
            min-height: 44px;
        }
        .bg-gradient-bottom {
            background: linear-gradient(180deg, rgba(255,255,255,0) 60%, rgba(50, 171, 253, 0.08) 100%);
        }
    </style>
</head>
<body class="bg-surface text-on-surface flex flex-col items-center bg-gradient-bottom">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md">
<div class="flex items-center h-16 px-6 w-full max-w-md mx-auto">
</div>
</header>
<!-- Main Content Area -->
<main class="w-full max-w-md px-8 pt-24 pb-12 flex-1 flex flex-col">
<!-- Header Section -->
<div class="mb-10 text-center">
<h1 class="text-3xl font-bold tracking-tight text-on-surface mb-2">创建账号</h1>
<p class="text-on-surface-variant font-medium">加入新一代即时通讯</p>
</div>
<!-- Card Container -->
<div class="space-y-6">
<!-- Phone Number Input -->
<div class="space-y-2">
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-xl" data-icon="smartphone">mail</span>
</div>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-high rounded-2xl border border-transparent focus:border-primary focus:bg-white focus:ring-4 focus:ring-primary/10 transition-all placeholder:text-on-surface-variant/50 font-body" placeholder="请输入您的邮箱地址" type="email"/>
</div>
</div>
<!-- Verification Code Input -->
<div class="space-y-2">
<div class="flex gap-3">
<div class="relative flex-1 group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-xl" data-icon="verified_user">mark_email_read</span>
</div>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-high rounded-2xl border border-transparent focus:border-primary focus:bg-white focus:ring-4 focus:ring-primary/10 transition-all placeholder:text-on-surface-variant/50 font-body" placeholder="验证码" type="text"/>
</div>
<button class="px-5 py-4 bg-surface-container-highest text-primary font-semibold rounded-2xl active:scale-95 transition-transform text-sm whitespace-nowrap min-w-[100px]">
                        获取验证码
                    </button>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-xl" data-icon="lock">lock</span>
</div>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-high rounded-2xl border border-transparent focus:border-primary focus:bg-white focus:ring-4 focus:ring-primary/10 transition-all placeholder:text-on-surface-variant/50 font-body" placeholder="设置密码" type="password"/>
<button class="absolute inset-y-0 right-0 w-12 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary Action Button -->
<div class="pt-4">
<button class="w-full py-4 bg-primary text-on-primary font-bold text-lg rounded-full shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all">
                    注册
                </button>
</div>
<!-- Agreement Checkbox -->
<div class="pt-2 flex space-x-3 px-1">
<div class="relative flex items-center">
<input class="w-5 h-5 border-outline-variant bg-surface-container-high text-primary focus:ring-primary focus:ring-offset-0 transition-all cursor-pointer rounded-md" id="agreement" type="checkbox"/>
</div>
<label class="text-sm text-on-surface-variant leading-relaxed cursor-pointer" for="agreement">
                    我已阅读并同意 <span class="text-primary font-medium hover:underline">服务协议</span> 和 <span class="text-primary font-medium hover:underline">隐私政策</span>
</label>
</div>
</div>
<!-- Secondary Navigation -->
<div class="mt-auto pt-12 text-center">
<p class="text-on-surface-variant">
                已有账号？ 
                <a class="text-primary font-bold hover:underline ml-1 inline-flex items-center justify-center px-2 py-1" href="#">去登录</a>
</p>
</div>
</main>
</body></html>
