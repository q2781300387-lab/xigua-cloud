<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
  精确还原设计：
  - 外层：128x128，圆角32px，蓝色渐变背景
  - 内层容器：96x96，居中
  - 白色拱门：宽81.6px (85%), 高67.2px (70%)
  - 顶部圆角，底部平直
  - 两个眼睛：6x10px，间距8px
  -->

  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0891e0"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="128" height="128" rx="32" fill="url(#bgGradient)"/>

  <!-- 白色拱门形状
       位置计算：
       - 内层容器从(16,16)开始，尺寸96x96
       - 白色形状宽81.6px，居中：16 + (96-81.6)/2 = 23.2
       - 白色形状高67.2px，mt-4(16px)：16 + 16 = 32
       - 底部位置：32 + 67.2 = 99.2
  -->
  <path d="M 23.2 99.2
           L 23.2 72.8
           Q 23.2 32 64 32
           Q 104.8 32 104.8 72.8
           L 104.8 99.2
           Z"
        fill="white"/>

  <!-- 左眼：6x10px椭圆，居中并偏左 -->
  <!-- 中心位置：水平(64 - 4 - 3) = 57，垂直(32 + 67.2/2) ≈ 65.6 -->
  <ellipse cx="57" cy="65.6" rx="3" ry="5" fill="#111111"/>

  <!-- 右眼：6x10px椭圆，居中并偏右 -->
  <!-- 中心位置：水平(64 + 4 + 3) = 71，垂直(32 + 67.2/2) ≈ 65.6 -->
  <ellipse cx="71" cy="65.6" rx="3" ry="5" fill="#111111"/>
</svg>
