<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>西瓜聊天 · 手机预览</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e9edf3;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
    }
    .phone {
      width: 390px;
      height: 844px;
      max-width: 100vw;
      max-height: 100vh;
      padding: 8px;
      border-radius: 44px;
      background: #111;
      box-shadow: 0 24px 70px rgba(16, 24, 40, .35), 0 2px 6px rgba(16, 24, 40, .18);
    }
    .screen {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 36px;
      background: #fff;
    }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    @media (max-width: 420px), (max-height: 880px) {
      body { background: #fff; }
      .phone { width: 100vw; height: 100vh; padding: 0; border-radius: 0; box-shadow: none; background: #fff; }
      .screen { border-radius: 0; }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0b0d12; }
      .phone { background: #000; }
      .screen, iframe { background: #0b0d12; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <iframe src="/" title="西瓜聊天手机预览"></iframe>
    </div>
  </div>
</body>
</html>
