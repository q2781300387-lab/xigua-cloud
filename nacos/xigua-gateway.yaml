spring:
  cloud:
    gateway:
      discovery:
        locator:
          lowerCaseServiceId: true
          enabled: true
      routes:
        - id: xigua-client
          uri: lb://xigua-client
          predicates:
            - Path=/client/**
          filters:
            - StripPrefix=1

        - id: xigua-center
          uri: lb://xigua-center
          predicates:
            - Path=/center/**
          filters:
            - StripPrefix=1

        - id: xigua-ai
          uri: lb://xigua-ai
          predicates:
            - Path=/ai/**
          filters:
            - StripPrefix=1

        - id: xigua-admin
          uri: lb://xigua-admin
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1

        - id: xigua-search
          uri: lb://xigua-search
          predicates:
            - Path=/search/**
          filters:
            - StripPrefix=1

springdoc:
  webjars:
    # 设置为空，不要前缀
    prefix:
  swagger-ui:
    urls:
      - name: client-api
        url: /client/v3/api-docs
      - name: center-api
        url: /center/v3/api-docs
      - name: ai-api
        url: /ai/v3/api-docs
      - name: admin-api
        url: /admin/v3/api-docs
      - name: search-api
        url: /search/v3/api-docs
