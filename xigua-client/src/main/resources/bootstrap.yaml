# Tomcat
server:
  port: 8084

# Spring
spring:
  application:
    # 应用名称
    name: xigua-client

  # 环境配置
  profiles:
    active: @profiles.active@
  cloud:
    nacos:
      server-addr: @nacos.server@
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        namespace: xigua
        # 显式指定注册 IP，避免虚拟网卡只拿到链路本地地址(169.254.x.x)时，
        # 网关/Dubbo 侧按该地址回连导致 WebSocket 下行不可达
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
      config:
        namespace: xigua
        # 配置文件格式
        file-extension: yaml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}

